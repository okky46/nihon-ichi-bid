<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>買える日本一 — 100円から。金額の順に並ぶ、日本のインターネットのランキング</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23FAF8F5'/%3E%3Crect x='3' y='5.5' width='18' height='3.4' rx='1.7' fill='%23E9654C'/%3E%3Crect x='3' y='10.8' width='12' height='3.4' rx='1.7' fill='%231A1A1A'/%3E%3Crect x='3' y='16.1' width='6.5' height='3.4' rx='1.7' fill='%23C8C4BE'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=M+PLUS+2:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F5; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#8C8A87;
  --line:#EBE7E2; --line-strong:#E2DDD6;
  --coral:#E9654C; --coral-btn:#F6B3A3;
  --coral-1:#FADCD1; --coral-2:#FCEDE7; --coral-3:#FDF6F2;
  --chip:#F1EEE9; --green:#22A55B; --r-card:26px;
  --gold:#C0951A; --silver:#8B9299; --bronze:#AC6E33;
  --f-lat:'Outfit'; --f-jp:'M PLUS 2';
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp),var(--f-lat),sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.lat{font-family:var(--f-lat),var(--f-jp),sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--coral);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}

header{display:flex;align-items:center;justify-content:space-between;padding:26px 0}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:.02em}
.logo svg{width:26px;height:26px;flex-shrink:0}
.logo .kaeru{color:var(--coral)}
nav{display:flex;align-items:center;gap:30px;font-size:17px;font-weight:500;color:#55524E}
nav a:hover{color:var(--ink)}

.hero{text-align:center;padding-top:34px}
.pill-stat{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:11px 26px;font-size:15px;color:#6E6B67;max-width:100%;flex-wrap:wrap;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;flex-shrink:0}
.dot.c{background:var(--coral)}
.pill-stat b{color:var(--green);font-weight:700}
.pill-stat .sep{color:#BDB9B3}

h1{margin-top:46px;font-size:58px;line-height:1.18;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}
h1 .amount{color:var(--coral)}
.step{width:36px;height:36px;border:0;border-radius:50%;background:var(--coral-1);color:var(--coral);font-size:22px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease}
.step:hover{background:#F7CDBE}
.lead{margin:22px auto 0;max-width:760px;font-size:19px;line-height:1.65;color:#5F5C58}
.lead .em{color:var(--coral);font-weight:500}

form{display:flex;gap:12px;margin-top:40px}
.field{flex:1.7;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:999px;height:64px;padding:0 26px}
.field svg{flex-shrink:0;color:#A9A6A1}
.field input{border:0;outline:0;background:transparent;width:100%;font:inherit;font-size:17px;color:var(--ink)}
.field input::placeholder{color:#A9A6A1}
.selectwrap{flex:1;position:relative;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:999px;height:64px;padding:0 26px}
.selectwrap select{appearance:none;border:0;outline:0;background:transparent;width:100%;font:inherit;font-size:17px;color:var(--ink);cursor:pointer}
.selectwrap .chev{position:absolute;right:24px;pointer-events:none;color:#8C8A87}
.submit{border:0;border-radius:999px;height:64px;min-width:180px;background:var(--coral-btn);color:#fff;font-family:inherit;font-size:19px;font-weight:700;cursor:pointer;transition:background .15s ease}
.submit:hover{background:var(--coral)}
.note{margin-top:20px;text-align:center;font-size:16px;color:var(--muted)}

.cats{display:flex;gap:10px;margin-top:40px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cats::-webkit-scrollbar{height:5px}
.cats::-webkit-scrollbar-thumb{background:#E0DBD4;border-radius:9px}
.cat{flex-shrink:0;border:1.5px solid var(--line-strong);background:transparent;border-radius:999px;padding:10px 18px;font-family:inherit;font-size:16px;font-weight:500;color:#55524E;cursor:pointer;white-space:nowrap;transition:border-color .15s ease,color .15s ease}
.cat:hover{border-color:#CFC8BF;color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--coral);border-color:var(--coral);color:#fff;font-weight:700}

.board{margin-top:26px}
.card{display:flex;align-items:center;gap:20px;border-radius:var(--r-card);padding:24px 28px;margin-bottom:16px}
.card.r1{background:var(--coral-1);border:2px solid var(--coral)}
.card.r2{background:var(--coral-2);border:1.5px solid #F7DACE}
.card.r3{background:var(--coral-3);border:1.5px solid #FAE7DF}
.rank{width:62px;flex-shrink:0;display:flex;justify-content:center}
.rank .badge{color:#fff;border-radius:999px;padding:6px 15px;font-size:17px;font-weight:700}
.r1 .badge{background:var(--gold)}
.r2 .badge{background:var(--silver)}
.r3 .badge{background:var(--bronze)}
.rank .plain{font-size:21px;font-weight:500;color:#77746F}
.icon{width:64px;height:64px;border-radius:16px;flex-shrink:0;background:rgba(0,0,0,.07)}
.body{flex:1;min-width:0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.name{font-size:21px;font-weight:700;letter-spacing:.01em}
.price{font-size:22px;font-weight:700;color:var(--coral);white-space:nowrap}
.desc{margin-top:6px;font-size:17px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .desc{color:#7C776F}
.meta{margin-top:10px;font-size:15px;color:#A09D99;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.meta .sep{color:#CFCBC6}

.row{display:flex;align-items:center;gap:20px;padding:22px 4px;border-bottom:1px solid var(--line)}
.row .icon{width:56px;height:56px;border-radius:14px;background:#EFECE7}

.empty{text-align:center;padding:56px 24px;border:1.5px dashed var(--line-strong);border-radius:var(--r-card);color:var(--muted);font-size:17px;line-height:1.9}
.empty b{color:var(--coral);font-weight:700}

.activity{background:#FBF8F5;border-radius:var(--r-card);padding:22px 24px;margin:26px 0 30px;box-shadow:0 2px 16px rgba(0,0,0,.04)}
.activity h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:9px}
.acts{display:flex;gap:14px;margin-top:16px;overflow-x:auto;padding-bottom:2px}
.act{background:var(--chip);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.act .av{width:34px;height:34px;border-radius:50%;background:#E3DFD9;flex-shrink:0}
.act .nm{font-size:16px;font-weight:700;white-space:nowrap}
.act .sub{font-size:14px;color:#7E7B77;white-space:nowrap}
.act .tm{font-size:13px;color:#A09D99;white-space:nowrap}

.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:34px}
.pager a,.pager span{min-width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;color:var(--coral)}
.pager .cur{background:var(--coral);color:#fff;font-weight:700}
.pager .gap{color:var(--muted)}
.count{text-align:center;margin-top:12px;font-size:16px;color:var(--muted)}
.refresh-wrap{display:flex;justify-content:flex-end;margin-top:22px}
.refresh{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:999px;padding:11px 22px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:9px;color:var(--ink)}
.refresh:hover{border-color:#D5CFC7}

footer{text-align:center;padding:58px 0 46px;font-size:16px;color:var(--muted);line-height:2}
footer a{color:var(--coral)}
footer .legal{color:#A09D99;font-size:15px}

@media (max-width:820px){
  body{font-size:16px}
  header{padding:20px 0}
  .logo{font-size:19px;gap:8px}
  .logo svg{width:23px;height:23px}
  nav{gap:20px;font-size:16px}
  .pill-stat{font-size:14px;padding:10px 20px;gap:6px}
  h1{font-size:38px;margin-top:34px;gap:10px}
  .step{width:32px;height:32px;font-size:19px}
  .lead{font-size:17px;margin-top:18px}
  form{flex-direction:column;gap:10px;margin-top:30px}
  .field,.selectwrap,.submit{height:58px;width:100%}
  .cats{margin-top:28px;gap:8px}
  .cat{font-size:15px;padding:9px 15px}
  .card{padding:20px;gap:14px;border-radius:22px}
  .row{gap:14px;padding:18px 0}
  .rank{width:auto}
  .icon{width:52px;height:52px;border-radius:13px}
  .row .icon{width:46px;height:46px}
  .top{flex-direction:column;align-items:flex-start;gap:2px}
  .name{font-size:18px}
  .price{font-size:19px}
  .desc{font-size:15px}
  .meta{font-size:14px}
  .pager a,.pager span{min-width:38px;height:38px;font-size:17px}
}
@media (max-width:560px){ nav .hide-sm{display:none} h1{font-size:30px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="logo" href="/" aria-label="買える日本一 ホーム"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4.5" width="20" height="3.6" rx="1.8" fill="#E9654C"/><rect x="2" y="10.2" width="13.5" height="3.6" rx="1.8" fill="#1A1A1A"/><rect x="2" y="15.9" width="7.5" height="3.6" rx="1.8" fill="#C8C4BE"/></svg><span><span class="kaeru">買える</span>日本一</span></a>
  <nav>
    <a href="/">ランキング</a>
    <a href="/rules" class="hide-sm">ルール</a>
    <a href="/contact">問い合わせ</a>
  </nav>
</header>

<section class="hero">
  <div class="pill-stat">
    <span class="dot"></span><b>142人</b><span>が閲覧中</span>
    <span class="sep">·</span><span>累計 <span class="lat">128,470</span>人</span>
    <span class="sep">·</span><span>掲載 <span class="lat" id="total">21</span>件</span>
  </div>

  <h1>
    <span id="heroLabel">1位を取るなら</span>
    <button class="step" id="dec" aria-label="100円下げる">−</button>
    <span class="amount lat" id="heroAmount">10,100円</span>
    <button class="step" id="inc" aria-label="100円上げる">＋</button>
  </h1>

  <p class="lead">
    <span class="em">掲載は100円から。</span>
    1位の金額を下回っても、その金額で入れる順位にそのまま掲載されます。
  </p>

  <form onsubmit="return false">
    <label class="field">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/>
      </svg>
      <input type="url" placeholder="掲載したいURL または @ハンドル">
    </label>
    <div class="selectwrap">
      <select id="catSelect" aria-label="カテゴリ"></select>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <button class="submit">掲載する</button>
  </form>

  <p class="note">すでに掲載されている場合は、同じURLを入力すると金額を上げられます。</p>
</section>

<div class="cats" id="cats" role="group" aria-label="カテゴリで絞り込む"></div>

<section class="board" id="board"></section>

<footer>
  <p class="legal">順位は掲載金額のみで決まります。品質や実績の評価ではありません。</p>
  <p>
    <a href="/terms">利用規約</a> · <a href="/privacy">プライバシーポリシー</a> ·
    <a href="/tokushoho">特定商取引法に基づく表記</a> · <a href="/contact">問い合わせ</a>
  </p>
</footer>

</div>

<script>
const STEP = 100, MIN = 100;

const CATS = [
  {slug:'all',       label:'すべて'},
  {slug:'person',    label:'個人・開発者'},
  {slug:'vtuber',    label:'VTuber・配信者'},
  {slug:'web',       label:'Webサイト・サービス'},
  {slug:'app',       label:'アプリ'},
  {slug:'game',      label:'ゲーム'},
  {slug:'work',      label:'創作・作品'},
  {slug:'shop',      label:'店・施設'},
  {slug:'company',   label:'企業・ブランド'},
  {slug:'community', label:'コミュニティ・イベント'},
  {slug:'other',     label:'その他'}
];
const LABEL = Object.fromEntries(CATS.map(c => [c.slug, c.label]));

const DATA = [
  {n:'量子将棋',              c:'game',      a:10000, d:'駒の動きが観測されるまで確定しない将棋。すべての駒が複数の可能性を同時に持ったまま盤上を動きます。', t:'21時間前'},
  {n:'非公開化ウォッチ',        c:'web',       a:5000,  d:'上場企業のMBO・TOBに関する観測情報を集めた公開データベース。断片的な情報を一箇所にまとめています。', t:'21時間前'},
  {n:'駅名タイピング',          c:'game',      a:1500,  d:'全国の地下鉄の駅名をひたすら打ち込むタイピングゲーム。路線ごとに順番に出題されます。', t:'昨日'},
  {n:'ライブ座席シミュレータ',   c:'web',       a:1200,  d:'日本のライブ会場の座席から見える景色を3Dで確認できるサービス。チケットを取る前に視界を確かめられます。', t:'昨日'},
  {n:'脱ドパ',                c:'app',       a:900,   d:'ショート動画の視聴時間を削るためのアプリ。使いすぎた分だけ次に開くまでの待ち時間が伸びていきます。', t:'2日前'},
  {n:'競艇メダルゲーム',        c:'game',      a:800,   d:'実際のレース映像を使って遊ぶブラウザのメダルゲーム。賭けではなく、あくまでメダルだけが増減します。', t:'2時間前'},
  {n:'@okky46',              c:'person',    a:700,   d:'個人開発者。Webサービスとゲームをつくっています。', t:'3日前'},
  {n:'鳥栖の町中華リスト',       c:'shop',      a:600,   d:'佐賀県鳥栖市の町中華を全店まわって記録しているサイト。営業時間と定休日を毎月確認しています。', t:'4日前'},
  {n:'決算跨ぎスクリーニング',   c:'web',       a:500,   d:'決算発表をまたぐ銘柄を独自の指標で絞り込むスクリーニングツール。過去の反応も同時に確認できます。', t:'5日前'},
  {n:'丸山製作所ファン',        c:'community', a:400,   d:'農機メーカーを勝手に応援している非公式コミュニティ。年に一度オフ会があります。', t:'5日前'},
  {n:'深夜のドット絵',          c:'work',      a:300,   d:'毎晩1枚ずつドット絵を投稿しているアカウント。テーマは主に夜の街と自販機です。', t:'6日前'},
  {n:'individual dev blog',   c:'person',    a:300,   d:'個人開発の収支と失敗を包み隠さず書いているブログ。月次で数字を公開しています。', t:'6日前'},
  {n:'アナログ盤の店',          c:'shop',      a:200,   d:'中古レコードの実店舗。在庫はすべてオンラインで検索できます。', t:'1週間前'},
  {n:'週末の写真',             c:'work',      a:100,   d:'週末に撮った写真だけを載せているサイト。更新は不定期です。', t:'1週間前'}
];

const state = { cat:'all', amount:0 };

function topAmount(cat){
  const list = DATA.filter(x => cat === 'all' || x.c === cat);
  return list.length ? Math.max(...list.map(x => x.a)) : 0;
}
function defaultAmount(cat){ return Math.max(topAmount(cat) + STEP, MIN); }
const yen = n => n.toLocaleString('ja-JP') + '円';

function renderCats(){
  document.getElementById('cats').innerHTML = CATS.map(c =>
    `<button class="cat" data-slug="${c.slug}" aria-pressed="${c.slug===state.cat}">${c.label}</button>`
  ).join('');
  document.querySelectorAll('.cat').forEach(b => b.addEventListener('click', () => {
    state.cat = b.dataset.slug;
    state.amount = defaultAmount(state.cat);
    renderAll();
  }));

  const sel = document.getElementById('catSelect');
  sel.innerHTML = CATS.filter(c => c.slug !== 'all')
    .map(c => `<option value="${c.slug}">${c.label}</option>`).join('');
  sel.value = state.cat === 'all' ? 'web' : state.cat;
  sel.onchange = () => { state.cat = sel.value; state.amount = defaultAmount(state.cat); renderAll(); };
}

function renderHero(){
  document.getElementById('heroLabel').textContent =
    state.cat === 'all' ? '1位を取るなら' : LABEL[state.cat] + 'で1位を取るなら';
  document.getElementById('heroAmount').textContent = yen(state.amount);
  document.getElementById('catSelect').value = state.cat === 'all' ? 'web' : state.cat;
  document.querySelectorAll('.cat').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.slug === state.cat)));
}

function listingHTML(item, rank, asCard){
  const badge = asCard
    ? `<span class="badge lat">#${rank}</span>`
    : `<span class="plain lat">#${rank}</span>`;
  const cls = asCard ? `card r${rank}` : 'row';
  const tag = asCard ? 'article' : 'div';
  const catLine = state.cat === 'all' ? `<span class="sep">·</span>${LABEL[item.c]}` : '';
  return `<${tag} class="${cls}">
    <div class="rank">${badge}</div>
    <div class="icon"></div>
    <div class="body">
      <div class="top"><span class="name">${item.n}</span><span class="price lat">${yen(item.a)}</span></div>
      <p class="desc">${item.d}</p>
      <div class="meta">${item.t}${catLine}</div>
    </div>
  </${tag}>`;
}

const ACTIVITY = `
<div class="activity">
  <h2><span class="dot c"></span>最新の動き</h2>
  <div class="acts">
    <div class="act"><span class="av"></span><span><span class="nm">競艇メダルゲーム</span><br><span class="sub lat">6位 · 800円</span><br><span class="tm">5分前</span></span></div>
    <div class="act"><span class="av"></span><span><span class="nm">丸山製作所ファン</span><br><span class="sub lat">10位 · 400円</span><br><span class="tm">8分前</span></span></div>
    <div class="act"><span class="av"></span><span><span class="nm">脱ドパ</span><br><span class="sub lat">5位 · 900円</span><br><span class="tm">10分前</span></span></div>
    <div class="act"><span class="av"></span><span><span class="nm">週末の写真</span><br><span class="sub lat">14位 · 100円</span><br><span class="tm">33分前</span></span></div>
  </div>
</div>`;

function renderBoard(){
  const list = DATA.filter(x => state.cat === 'all' || x.c === state.cat)
                   .sort((a,b) => b.a - a.a);
  const board = document.getElementById('board');

  if(!list.length){
    board.innerHTML = `<div class="empty">
      このカテゴリにはまだ何も掲載されていません。<br>
      いま掲載すれば <b>100円</b> で「${LABEL[state.cat]}」の1位です。
    </div>`;
    return;
  }

  let html = '';
  list.forEach((item, i) => {
    const rank = i + 1;
    html += listingHTML(item, rank, rank <= 3);
    if(rank === 3 && state.cat === 'all') html += ACTIVITY;
  });

  html += `
    <div class="pager">
      <a href="#" aria-label="前へ">‹</a>
      <span class="cur lat">1</span>
      <a href="#" aria-label="次へ">›</a>
    </div>
    <p class="count lat">1 – ${list.length} / ${list.length}件</p>
    <div class="refresh-wrap">
      <button class="refresh">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>更新
      </button>
    </div>`;
  board.innerHTML = html;
}

function renderAll(){ renderHero(); renderBoard(); }

document.getElementById('inc').onclick = () => { state.amount += STEP; renderHero(); };
document.getElementById('dec').onclick = () => { state.amount = Math.max(MIN, state.amount - STEP); renderHero(); };
document.getElementById('total').textContent = DATA.length;

state.amount = defaultAmount('all');
renderCats();
renderAll();
</script>
